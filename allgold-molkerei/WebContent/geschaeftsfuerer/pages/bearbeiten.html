<!DOCTYPE html>
<html>
  <head>
    <meta charset="ISO-8859-1">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Allgold Supply Center</title>
	<link href="../css/main.css" rel="stylesheet" />
  </head>
	<body>
		<div class="div-center">
			<img src="../resources/banner.png" style="margin-top: 200px;"width= "474" height="192" >
			<h1 style="margin-top: 30px;">Verkaufsstelle Bearbeiten</h1>
			<a href="uebersicht.html">
				<button class="blue-button" style="margin-top: 10px; margin-bottom: 10px;">Bearbeitung abbrechen</button>
			</a>
			<form>
				<div  class="div-inline">
					<div style="width: 200px">
						<label for="name">Name:</label>
						<input type="text" id="name" placeholder="Name eingeben" name="name">
						<label for="id">ID:</label>
						<input type="text" id="id" placeholder="ID eingeben" name="id">
						<label for="typ">Typ:</label>
						<input type="text" id="typ" placeholder="Typ eingeben" name="typ">
					</div>
					<div style="width: 200px">
						<label for="ort">Ort:</label>
						<input type="text" id="ort" placeholder="Ort eingeben" name="pswd">
						<label for="plz">PLZ:</label>
						<input type="text" id="plz" placeholder="plz eingeben" name="plz">
						<label for="str">Straße:</label>
						<input type="text" id="str" placeholder="Straße eingeben" name="str">
						<label for="hnr">Hausnr:</label>
						<input type="text" id="hnr" placeholder="Hausnummer eingeben" name="hnr">
					</div>
					<div style="width: 200px">
						<label for="Beschreibung">Beschreibung:</label>
						<textarea placeholder="Beschreibung eingeben"></textarea>
					</div>
				</div>
				<button style="margin-right: 250px" class="green-button" style="margin-top: 30px;" type="submit">Speichern</button>
				<button style="margin-left: 250px" class="red-button" style="margin-top: 30px;" >Löschen</button>
			</form>
		</div>
	</body>
</html>
